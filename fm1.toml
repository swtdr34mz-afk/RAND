# RAND build settings (fm1-base tools/build.py). The pixel type of the screens: X0X_FONTSET=terminus in the
# environment (the workflow sets it; for a local build: X0X_FONTSET=terminus python3 fm1-base/tools/build.py . --host)
name = "rand"                     # the build's file names: rand-0.1.fwsc, build/host/rand_host
title = "RAND"                    # the name people see (firmware hubs)
id_prefix = "FM-1_588"            # package identity: dev FM-1_58800, releases FM-1_588 + XXYYZZ
usb_manufacturer = "swtdr34mz"
usb_product = "RAND FM-1"         # the USB name (the MIDI port in a DAW)
o2 = ["dsp/rand_core.c"]          # the sound core, at -O2 (the same files the VST will use)
include = ["dsp"]
vendored = ["fm1-base/"]          # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
ble = false
tagline = "A raw percussion synth: one voice, eight steps, a clock that turns into a tone"
repo = "https://github.com/swtdr34mz-afk/RAND"
licence = "MPL-2.0"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."
author = "swtdr34mz"
description = "A semi-modular style percussion synth in the spirit of the Behringer EDGE and Moog DFAM: two oscillators with FM and hard sync, noise, a 24 dB ladder filter (low and high pass), pitch, filter and amp envelopes and drive. An 8-step sequencer with two rows, pitch and velocity, whose clock runs from quarter speed up to x128, where the rhythm turns into a tone; five held keys jump the clock at once. Eight presets, random rows, pads, MIDI clock and transport in to follow a drum machine."
tags = ["drum-machine", "synth"]
install = "https://github.com/swtdr34mz-afk/RAND/releases"
screenshot = "site/img/screen-main.png"
