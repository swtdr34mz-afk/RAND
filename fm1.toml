# RAND build settings (fm1-base tools/build.py). The type of the screens (smoothed Barlow): X0X_FONTSET=barlow in the
# environment (the workflow sets it; for a local build: X0X_FONTSET=barlow python3 fm1-base/tools/build.py . --host)
name = "rand"                     # the build's file names: rand-0.1.fwsc, build/host/rand_host
title = "RAND"                    # the name people see (firmware hubs)
id_prefix = "FM-1_588"            # package identity: dev FM-1_58800, releases FM-1_588 + XXYYZZ
usb_manufacturer = "swtdr34mz"
usb_product = "RAND FM-1"         # the USB name (the MIDI port in a DAW)
o2 = ["dsp/rand_core.c"]          # the sound core, at -O2 (the same files the VST will use)
include = ["dsp"]
vendored = ["fm1-base/"]          # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
ble = false
tagline = "A raw percussion synth: one voice, eight steps, a clock that turns into a tone"
repo = "https://github.com/swtdr34mz-afk/RAND"
licence = "MPL-2.0"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."
author = "swtdr34mz"
description = "A percussion synth after the Behringer EDGE and Moog DFAM: two oscillators with FM and sync, noise, a 24 dB ladder filter, three envelopes, drive, ping-pong delay, reverb and master filter. An 8-step sequencer with a pitch and a velocity knob per step whose clock runs up to x128, where the rhythm turns into a tone. The keys are a patchbay: hold a black key (an output: VCOs, noise, envelopes, LFO, random, trigger) and tap a white key (an input: pitch, FM, cutoff, VCA, tempo, delay, reverb, crush). Eight presets, MIDI clock in."
tags = ["drum-machine", "synth"]
install = "https://github.com/swtdr34mz-afk/RAND/releases"
screenshot = "site/img/screen-main.png"
